spring:
  application:
    name: tegaprive-backend
  datasource:
    url: jdbc:postgresql://${TP_DB_HOST:localhost}:${TP_DB_PORT:5432}/${TP_DB_NAME:tegaprive}
    username: ${TP_DB_USERNAME:postgres}
    password: ${TP_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${TP_SERVER_PORT:8080}

tp:
  jwt:
    secret: ${TP_JWT_SECRET:dev-only-secret-change-me-please-make-this-at-least-32-bytes-long}
    access-expiration-min: ${TP_JWT_ACCESS_EXPIRATION_MIN:30}
    refresh-expiration-days: ${TP_JWT_REFRESH_EXPIRATION_DAYS:7}
  cors:
    allowed-origins: ${TP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  default-admin:
    email: ${TP_DEFAULT_ADMIN_EMAIL:}
    password: ${TP_DEFAULT_ADMIN_PASSWORD:}
  storage:
    # local = dev (files served at /uploads/**); cloudinary = production
    provider: ${TP_STORAGE_PROVIDER:local}
    local-dir: ${TP_STORAGE_LOCAL_DIR:uploads}
    cloudinary-cloud-name: ${TP_CLOUDINARY_CLOUD_NAME:}
    cloudinary-api-key: ${TP_CLOUDINARY_API_KEY:}
    cloudinary-api-secret: ${TP_CLOUDINARY_API_SECRET:}

  payment:
    # dev-bypass=true lets /api/payments/{id}/dev-confirm confirm without a real webhook.
    # Set to false in production.
    dev-bypass: ${TP_PAYMENT_DEV_BYPASS:true}
    mtn:
      api-base-url: ${TP_MTN_API_BASE_URL:https://sandbox.momodeveloper.mtn.com}
      subscription-key: ${TP_MTN_SUBSCRIPTION_KEY:}
      api-user: ${TP_MTN_API_USER:}
      api-key: ${TP_MTN_API_KEY:}
      callback-host: ${TP_MTN_CALLBACK_HOST:}
      target-environment: ${TP_MTN_TARGET_ENVIRONMENT:sandbox}
    airtel:
      api-base-url: ${TP_AIRTEL_API_BASE_URL:https://openapiuat.airtel.africa}
      client-id: ${TP_AIRTEL_CLIENT_ID:}
      client-secret: ${TP_AIRTEL_CLIENT_SECRET:}
      callback-host: ${TP_AIRTEL_CALLBACK_HOST:}

logging:
  level:
    com.tegaprive: INFO
    org.springframework.security: INFO

# Convenience: PostgreSQL + PostGIS for local development (requires Docker).
# The backend also runs against a native PostgreSQL+PostGIS install.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tegaprive-db
    environment:
      POSTGRES_DB: tegaprive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tegaprive-db-data:/var/lib/postgresql/data

volumes:
  tegaprive-db-data:
